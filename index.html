<style>
:root {
  --gold: #D4AF37;
  --bronze: #C07020;
  --dark-bg: #0D0D0D;
  --dark-elevated: #1A1A1A;
  --dark-card: #1E1E1E;
  --dark-border: rgba(212,175,55,0.15);
  --text-primary: #F0EDE8;
  --text-muted: #888880;
  --text-gold: #D4AF37;
  --success: #4CAF7D;
  --error: #E05252;
  --frosted: rgba(255,255,255,0.04);
  --frosted-border: rgba(212,175,55,0.12);
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, sans-serif;
}
[data-theme="light"] {
  --dark-bg: #F5F0E8;
  --dark-elevated: #EDE8DE;
  --dark-card: #F8F5F0;
  --text-primary: #1A1A1A;
  --text-muted: #666660;
  --frosted: rgba(0,0,0,0.03);
  --frosted-border: rgba(180,140,20,0.18);
  --dark-border: rgba(180,140,20,0.18);
}

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}

body {
  background: var(--dark-bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  overflow: hidden;
}

@media (min-width: 420px) {
  body {
    background: #000;
  }
  #app-wrapper {
    border-radius: 32px;
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
  }
}

/* ── App Frame ── */
#app-wrapper {
  max-width: 420px;
  margin: auto;
  height: 100vh;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,0.8);
  border-radius: 32px;
}

/* ── Screen ── */
#screen {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 80px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#screen.no-bottom-nav {
  bottom: 0;
}

/* ── Bottom Nav ── */
#bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--dark-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 12px 16px;
}

.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 8px 4px;
  border-radius: 12px;
  transition: all 0.2s;
  position: relative;
}

.nav-tab.active .nav-icon {
  color: var(--gold);
}

.nav-tab.active .nav-label {
  color: var(--gold);
}

.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  width: 20px;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

.nav-label {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ── Cart Badge ── */
.cart-badge {
  position: absolute;
  top: 4px;
  right: 50%;
  transform: translateX(100%);
  background: var(--gold);
  color: #000;
  font-size: 9px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  animation: badge-bounce 0.3s ease;
}

@keyframes badge-bounce {
  0%,100%{transform:translateX(100%) scale(1)}
  50%{transform:translateX(100%) scale(1.3)}
}

/* ── Card Base ── */
.card {

  border-radius: 16px;
  overflow: hidden;
}

/* ── Gold Button ── */

  font-weight: 700;
  border: none;
  border-radius: 24px;

  font-family: var(--font-sans);

}

}

#toast-container {

@keyframes slide-up-modal {

/* ── Category Tabs ── */
.cat-tab {
  padding: 8px 16px;

  white-space: nowrap;

  font-size: 12px;

.chat-bubble-user {

.chat-bubble-ai {

.chat-time {

/* ── Typing Indicator ── */
.typing-dot {

@keyframes typing-bounce {

/* ── Order Stepper ── */
.step-line {
  position: absolute;

}

.step-line.done {

}

/* ── Scrollbar Hiding ── */
::-webkit-scrollbar{display:none}

/* ── Utility ── */
.no-select {

}

/* ── Slide-up Animation ── */
@keyframes slide-up {
  from{opacity:0;transform:translateY(20px)}

.anim-card {

}

/* ── Stars ── */
.star-filled {
  color: var(--gold);
}

.star-empty {
  color: var(--dark-border);
}

/* ── Product Grid ── */
.product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  padding: 12px;

/* ── Section Title ── */
.section-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;

}

/* ── Pill Bar ── */
.pill-bar {

/* ── Scroll Row ── */
.scroll-row {

.scroll-row::-webkit-scrollbar {

.frosted-card {

  if (coupon.type === 'percent') return Math.round(subtotal * coupon.value / 100);
  return 0;
}

const CATEGORIES = ['All', 'Groceries (Exotic)', 'Snacks', 'Ready-to-Eat', 'Meats & Seafood', 'Artisan Cheeses', 'Fine Wines & Spirits', 'Luxury Beverages', 'Makeup', 'Skincare', 'Hair Care'];

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt = n => '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtInt = n => '₹' + Number(n).toLocaleString('en-IN');
const fmtDate = ts => new Date(ts).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'});
const fmtTime = d => { const t = d instanceof Date ? d : new Date(d); return t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0'); };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getProduct = id => PRODUCTS.find(p => p.id === id);
const cartCount = () => Object.values(appState.cart).reduce((a,b)=>a+b,0);
const cartItems = () => Object.entries(appState.cart).filter(([,q])=>q>0).map(([id,qty])=>({...getProduct(id),qty}));
function stars(rating, size=12) {
  let s=''; for(let i=1;i<=5;i++){
    const filled=i<=Math.floor(rating);
    const half=!filled&&i-0.5<=rating;
    s+=`<span style="font-size:${size}px;color:${filled||half?'var(--gold)':'var(--dark-border)'}">${filled?'★':half?'⯨':'★'}</span>`;
  } return s;
}
function calcCart() {
  const items = cartItems();
  const subtotal = items.reduce((a,i)=>a+i.price*i.qty,0);
  const totalMrp = items.reduce((a,i)=>a+i.mrp*i.qty,0);
  const savings = totalMrp - subtotal;
  const taxes = subtotal * 0.12;
  const convFee = (subtotal + taxes) * 0.005;
  const freeDelivery = subtotal > 1500 || ['Gold','Platinum'].includes(appState.profile.loyaltyTier);
  const deliveryFee = freeDelivery ? 0 : 29;
  let couponDiscount = 0;
  if (appState.appliedCoupon) {
    couponDiscount = getCouponDiscount(appState.appliedCoupon, subtotal) || 0;
  }
  const totalPayable = Math.max(0, subtotal + taxes + convFee + deliveryFee - couponDiscount);
  return { subtotal, totalMrp, savings, taxes, convFee, deliveryFee, freeDelivery, couponDiscount, totalPayable };
}

function navigateTo(screen, params={}) {
  if(appState.trackingAnimFrame){ cancelAnimationFrame(appState.trackingAnimFrame); appState.trackingAnimFrame=null; }
  appState.currentScreen = screen;
  appState.navigationDetail = params.productId || null;
  appState.navigationOrder = params.orderId || null;
  renderApp();

  if(screenEl) screenEl.scrollTop = 0;

  renderBottomNav();
  const screen = appState.currentScreen;
  const hideNav = ['detail','tracking','admin'].includes(screen);
  const screenEl = document.getElementById('screen');

  if(hideNav){ screenEl.style.bottom='0'; navEl.style.display='none'; }
  else { screenEl.style.bottom='80px'; navEl.style.display='flex'; }
  switch(screen) {
    case 'home': screenEl.innerHTML = renderHome(); break;
    case 'concierge': screenEl.innerHTML = renderConcierge(); attachConciergeEvents(); break;
    case 'tryon': screenEl.innerHTML = renderARMirror(); initAR(); break;
    case 'cart': screenEl.innerHTML = renderCart(); break;

    case 'detail': screenEl.innerHTML = renderDetail(appState.navigationDetail); break;
    case 'tracking': screenEl.innerHTML = renderTracking(appState.navigationOrder); initTrackingCanvas(); break;
    case 'admin': screenEl.innerHTML = renderAdmin(); break;
    default: screenEl.innerHTML = renderHome();
  }
}

function renderChatBubble(msg) {
  const isUser = msg.sender === 'user';
  const time = fmtTime(msg.timestamp);
  const productRefs = [];
  const content = msg.content.replace(/\b(p_[a-z_]+)\b/g, (match) => {
    const prod = getProduct(match);
    if (prod) { productRefs.push(prod); return `<strong>${prod.name}</strong>`; }
    return match;
  });
  const productCards = productRefs.map(p => `
    <div class="card" style="padding:10px;display:flex;align-items:center;gap:10px;margin-top:6px;cursor:pointer" onclick="navigateTo('detail',{productId:'${p.id}'})">
      <span style="font-size:20px">${p.flag}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
        <div style="font-size:11px;color:var(--gold)">${fmtInt(p.price)}</div>
      </div>
      <span style="color:var(--gold);font-size:12px;font-weight:600;flex-shrink:0">View ›</span>
    </div>`).join('');
  return `
    <div style="display:flex;flex-direction:column;align-items:${isUser?'flex-end':'flex-start'}">
      <div class="${isUser?'chat-bubble-user':'chat-bubble-ai'}">${content}</div>
      ${!isUser && productCards ? productCards : ''}
      <div class="chat-time" style="text-align:${isUser?'right':'left'}">${time}</div>
    </div>`;
}

function attachConciergeEvents() {
  setTimeout(() => {
    const msgs = document.getElementById('chat-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 50);
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  appState.chatMessages.push({ sender: 'user', content: text, timestamp: new Date() });
  appState.chatLoading = true;
  input.value = '';
  renderApp();
  askConcierge(text);
}

async function askConcierge(prompt) {
  const lower = prompt.toLowerCase();
  let response = '';
  if (GEMINI_API_KEY !== 'MY_GEMINI_API_KEY') {
    try {
      const history = appState.chatMessages.slice(0, -1).map(m => ({
        role: m.sender === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      }));
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: 'You are the premium personal shopping butler/concierge of Maison Lux, an ultra-luxury quick-commerce app in Bangalore delivering exotic groceries, gourmet snacks, ready-to-eat gourmet meals, premium meats, artisan cheeses, fine wines, luxury beverages, and haute cosmetics. Respond in an elegant, refined, helpful luxury style. Keep recommendations short, helpful, and sophisticated. Reference product IDs like p_truffle or p_wagyu_steak when recommending.' }] },
          contents: [...history, { role: 'user', parts: [{ text: prompt }] }]
        })

      response = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

  if (!response) {

    else if (/lipstick|lips/.test(lower)) response = `Two icons await you. The Satin Champagne Gold (p_lipstick_gold) for luminous golden evenings, and the Rose Velvet Matte (p_lipstick_crimson) for bold, unapologetic crimson drama. Visit our AR Mirror to trial both shades live.`;

    else if (/cheese/.test(lower)) response = `Superb taste. Our Brie de Meaux AOP (p_cheese_brie) is at perfect ripeness today, and our 36-month Parmigiano Reggiano (p_cheese_parm) from Cravero is intensely crystalline. Shall I suggest a pairing platter?`;
    else if (/mango|miyazaki|fruit/.test(lower)) response = `The Japanese Miyazaki Mango (p_mango) — "Egg of the Sun" — is perhaps the world's most perfect fruit. Sugar content guaranteed above 15%, completely fibreless. Presented in a ceremonial wooden box. ₹4,500 for an unforgettable experience.`;
    else if (/coffee/.test(lower)) response = `Our Gesha Village Anaerobic Natural (p_coffee) scored 93.5 on the SCA scale — essentially a perfect coffee. Jasmine florals, mango, and bergamot notes that defy belief. It brews like liquid perfume.`;
    else if (/matcha|tea/.test(lower)) response = `The Ippodo First Flush Uji Matcha (p_matcha) is ceremonial grade at its finest — brilliant emerald, creamy sweetness, zero bitterness. Our Ceremonial Matcha Pocky (p_matcha_pocky) offers a more playful expression of the same Uji terroir.`;
    else response = `At Maison Lux, every product is curated from the world's finest artisans and producers. From rare Kashmiri saffron (p_saffron) to Tsukiji bluefin otoro (p_bluefin), we deliver Bangalore's most exclusive selection to your door within 45 minutes. How may I serve you?`;

  appState.chatMessages.push({ sender: 'AI', content: response, timestamp: new Date() });
  appState.chatLoading = false;
  renderApp();
}

function selectShade(hex) {
  appState.selectedLipstickHex = hex;
  document.querySelectorAll('.shade-swatch').forEach(s => {
    s.classList.toggle('active', s.parentElement.getAttribute('onclick') && s.parentElement.getAttribute('onclick').includes(hex));
  });
  renderApp();
}

let arStream = null;
function initAR() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        arStream = stream;
        const video = document.getElementById('ar-video');
        const fallback = document.getElementById('ar-fallback');
        const status = document.getElementById('ar-status');
        if (!video) return;
        video.srcObject = stream;
        video.style.display = 'block';
        if (fallback) fallback.style.display = 'none';
        if (status) status.innerHTML = '<span style="color:var(--success)">🟢 Live AR Active</span>';
        video.onloadedmetadata = () => drawAROverlay();
      })
      .catch(() => {
        const status = document.getElementById('ar-status');
        const fallback = document.getElementById('ar-fallback');
        if (status) status.innerHTML = '<div style="color:var(--gold);font-weight:600">Live AR Mockup Active</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Camera not found — using real-time makeup simulator.</div>';
        if (fallback) fallback.style.display = 'flex';
        drawARFallback();
      });
  } else {
    drawARFallback();
  }
}

function drawAROverlay() {
  const canvas = document.getElementById('ar-canvas');
  const video = document.getElementById('ar-video');
  if (!canvas || !video) return;
  const ctx = canvas.getContext('2d');
  function draw() {
    if (!document.getElementById('ar-canvas')) return;
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.68;
    const rx = canvas.width * 0.18;
    const ry = canvas.height * 0.07;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(appState.selectedLipstickHex, 0.45);
    ctx.fill();
    requestAnimationFrame(draw);
  }
  draw();
}

function drawARFallback() {
  const canvas = document.getElementById('ar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  function draw() {
    if (!document.getElementById('ar-canvas')) return;
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.68;
    const rx = canvas.width * 0.22;
    const ry = canvas.height * 0.08;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(appState.selectedLipstickHex, 0.5);
    ctx.fill();
    requestAnimationFrame(draw);
  }
  draw();
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyCoupon() {
  const input = document.getElementById('coupon-input');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  const { subtotal } = calcCart();
  const discount = getCouponDiscount(code, subtotal);
  if (discount !== null) {
    appState.appliedCoupon = code;
    appState.couponError = null;
    showToast(`${code} applied!`, 'success');
  } else {
    appState.couponError = 'Invalid coupon code. Try WELCOME, AMEXGOLD or MLUXMAYANK.';
    appState.appliedCoupon = null;
  }
  renderApp();
}

// ── SUBMIT ORDER ──────────────────────────────────────────────────────────────
function submitOrder() {
  const items = cartItems();
  if (!items.length) return;
  const { subtotal, taxes, convFee, deliveryFee, couponDiscount, totalPayable } = calcCart();
  const orderId = 'ORD-' + Date.now();
  const itemsSummary = items.map(i => `${i.name} × ${i.qty}`).join(', ');
  const order = {
    id: orderId,
    timestamp: Date.now(),
    itemsSummary,
    subtotal, taxes, convFee, deliveryFee,
    discountApplied: couponDiscount,
    totalPayable,
    status: 'Placed',
    deliveryPin: appState.profile.pincode,
    etaMinutes: 35,
    addressName: appState.profile.savedAddress,
    paymentMethod: appState.selectedPaymentMethod,
    deliverySlot: appState.selectedDeliverySlot,
  };
  appState.orders.unshift(order);
  const mult = { Silver: 1.0, Gold: 1.5, Platinum: 2.0 }[appState.profile.loyaltyTier] || 1;
  const pts = Math.floor(totalPayable / 100) * mult;
  appState.profile.loyaltyPoints = Math.round(appState.profile.loyaltyPoints + pts);
  if (appState.profile.loyaltyPoints >= 3000) appState.profile.loyaltyTier = 'Platinum';
  else if (appState.profile.loyaltyPoints >= 1000) appState.profile.loyaltyTier = 'Gold';
  if (appState.selectedPaymentMethod === 'Wallet') {
    appState.profile.walletBalance = Math.max(0, appState.profile.walletBalance - totalPayable);
  }
  appState.cart = {};
  appState.appliedCoupon = null;
  appState.couponError = null;
  appState.activeOrderId = orderId;
  const statuses = ['Confirmed','Packed','Out for Delivery','Delivered'];
  const delays = [5000, 12000, 20000, 35000];
  statuses.forEach((status, i) => {
    setTimeout(() => {
      const o = appState.orders.find(x => x.id === orderId);
      if (o) { o.status = status; if (appState.currentScreen === 'tracking' && appState.navigationOrder === orderId) renderApp(); }
    }, delays[i]);
  });
  showToast('Order placed! Track it live.', 'success');
  navigateTo('tracking', { orderId });
}

function initTrackingCanvas() {
  const canvas = document.getElementById('tracking-canvas');
  if (!canvas) return;
  const order = appState.orders.find(o => o.id === appState.navigationOrder);
  if (!order) return;
  const statusMap = { Placed:0, Confirmed:1, Packed:2, 'Out for Delivery':3, Delivered:4 };
  const stepIndex = statusMap[order.status] || 0;
  const t = stepIndex / 4;

  function draw() {
    if (!document.getElementById('tracking-canvas')) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    const p0 = {x: W*0.12, y: H*0.2};
    const p1 = {x: W*0.4, y: H*0.15};
    const p2 = {x: W*0.6, y: H*0.85};
    const p3 = {x: W*0.88, y: H*0.8};
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(p1.x,p1.y,p2.x,p2.y,p3.x,p3.y);
    ctx.strokeStyle = 'rgba(192,160,96,0.25)';
    ctx.lineWidth = 3;
    ctx.stroke();
    if (t > 0) {
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      const steps = 60;
      for (let s = 0; s <= steps * t; s++) {
        const u = s / steps;
        const bx = Math.pow(1-u,3)*p0.x + 3*Math.pow(1-u,2)*u*p1.x + 3*(1-u)*u*u*p2.x + u*u*u*p3.x;
        const by = Math.pow(1-u,3)*p0.y + 3*Math.pow(1-u,2)*u*p1.y + 3*(1-u)*u*u*p2.y + u*u*u*p3.y;
        ctx.lineTo(bx, by);
      }
      ctx.strokeStyle = 'var(--gold)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    const cx = Math.pow(1-t,3)*p0.x + 3*Math.pow(1-t,2)*t*p1.x + 3*(1-t)*t*t*p2.x + t*t*t*p3.x;
    const cy2 = Math.pow(1-t,3)*p0.y + 3*Math.pow(1-t,2)*t*p1.y + 3*(1-t)*t*t*p2.y + t*t*t*p3.y;
    const pulse = Math.sin(Date.now()/400) * 4;
    ctx.beginPath();
    ctx.arc(cx, cy2, 10 + pulse, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(212,175,55,0.2)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy2, 7, 0, Math.PI*2);
    ctx.fillStyle = 'var(--gold)';
    ctx.fill();
    ctx.font = '18px serif';
    ctx.fillText('📦', p0.x-10, p0.y+6);
    ctx.fillText('📍', p3.x-10, p3.y+6);
    appState.trackingAnimFrame = requestAnimationFrame(draw);
  }
  draw();
}

function sendDriverMsg() {
  const input = document.getElementById('driver-msg-input');
  if (!input || !input.value.trim()) return;
  appState.driverMessages.push({ sender: 'user', content: input.value.trim() });
  input.value = '';
  const replies = ["Got it!", "Sure, I'll call when nearby.", "Will be there shortly.", "Thank you, have a great day! 🙏"];
  const reply = replies[Math.floor(Math.random() * replies.length)];
  setTimeout(() => {
    appState.driverMessages.push({ sender: 'driver', content: reply });
    const msgsEl = document.getElementById('driver-chat-msgs');
    if (msgsEl) { msgsEl.innerHTML = appState.driverMessages.map(m=>`
      <div style="display:flex;flex-direction:column;align-items:${m.sender==='user'?'flex-end':'flex-start'};margin-bottom:10px">
        <div class="${m.sender==='user'?'chat-bubble-user':'chat-bubble-ai'}">${esc(m.content)}</div>
      </div>`).join(''); msgsEl.scrollTop = msgsEl.scrollHeight; }
  }, 1500);
  const msgsEl = document.getElementById('driver-chat-msgs');
  if (msgsEl) { msgsEl.innerHTML = appState.driverMessages.map(m=>`
    <div style="display:flex;flex-direction:column;align-items:${m.sender==='user'?'flex-end':'flex-start'};margin-bottom:10px">
      <div class="${m.sender==='user'?'chat-bubble-user':'chat-bubble-ai'}">${esc(m.content)}</div>

}

        <!-- Coupon Registry -->
        <div class="card" style="padding:16px;margin-bottom:14px">
          <div style="font-family:var(--font-serif);font-size:17px;margin-bottom:4px">🎟 Coupon Registry</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Register custom promotional coupon codes (₹100 flat discount).</div>
          <div style="display:flex;gap:8px">
            <input class="glass-input" id="coupon-code-input" placeholder="e.g. ULTRA99" style="flex:1">
            <button class="btn-gold" style="padding:10px 16px" onclick="registerCoupon()">Register</button>
          </div>
          ${appState.customCoupons.length ? `
          <div style="margin-top:12px">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Registered codes:</div>
            ${appState.customCoupons.map(c=>`<span style="display:inline-block;background:rgba(212,175,55,0.1);border:1px solid var(--dark-border);border-radius:8px;padding:3px 10px;font-size:11px;color:var(--gold);margin:3px">${c}</span>`).join('')}
          </div>` : ''}
        </div>

        <!-- Reseed -->
        <div class="card" style="padding:16px;margin-bottom:14px">
          <div style="font-family:var(--font-serif);font-size:17px;margin-bottom:4px">🌐 Product Database Reseed</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Force-reload all ${PRODUCTS.length} luxury SKUs into the product catalog.</div>
          <button class="btn-gold" style="width:100%;padding:12px;font-size:13px" onclick="document.getElementById('reseed-msg').style.display='block'">🌐 Force Reseed Products</button>
          <div id="reseed-msg" style="display:none;margin-top:10px;padding:10px;background:rgba(76,175,125,0.1);border:1px solid var(--success);border-radius:10px;color:var(--success);font-size:12px;text-align:center">
            ✓ Luxury product database populated with ${PRODUCTS.length} detailed SKUs!
          </div>
        </div>

        <!-- Quick State -->
        <div class="card" style="padding:16px">
          <div style="font-family:var(--font-serif);font-size:17px;margin-bottom:8px">📊 App State</div>
          <div style="font-size:11px;color:var(--text-muted);line-height:1.8">
            <div>Cart items: <span style="color:var(--gold)">${cartCount()}</span></div>
            <div>Orders placed: <span style="color:var(--gold)">${appState.orders.length}</span></div>
            <div>Wishlist items: <span style="color:var(--gold)">${appState.wishlist.size}</span></div>
            <div>Loyalty: <span style="color:var(--gold)">${appState.profile.loyaltyTier} · ${appState.profile.loyaltyPoints} pts</span></div>
            <div>Theme: <span style="color:var(--gold)">${appState.isDarkTheme?'Dark':'Light'}</span></div>
          </div>
        </div>
      </div>
    </div>`;
}

function injectWallet() {
  const input = document.getElementById('wallet-amount');
  const amount = parseFloat(input?.value || appState.adminWalletInput);
  if (isNaN(amount) || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
  appState.profile.walletBalance += amount;
  showToast(`${fmt(amount)} injected to Lux Wallet`, 'success');
  renderApp();
}
function registerCoupon() {
  const input = document.getElementById('coupon-code-input');
  const code = input?.value.trim().toUpperCase();
  if (!code || code.length < 3) { showToast('Enter a valid coupon code', 'error'); return; }
  if (appState.customCoupons.includes(code)) { showToast('Code already registered', 'info'); return; }
  appState.customCoupons.push(code);
  showToast(`${code} registered! (₹100 flat off)`, 'success');
  renderApp();
}

// ── MISC ACTIONS ──────────────────────────────────────────────────────────────
function toggleTheme() {
  appState.isDarkTheme = !appState.isDarkTheme;
  document.documentElement.setAttribute('data-theme', appState.isDarkTheme ? 'dark' : 'light');
  renderApp();
}

function toggleWishlist(id) {
  if (appState.wishlist.has(id)) { appState.wishlist.delete(id); showToast('Removed from wishlist', 'info'); }
  else { appState.wishlist.add(id); showToast('Added to wishlist ♥', 'success'); }
  renderApp();
}

function updateCart(id, delta) {
  const current = appState.cart[id] || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) delete appState.cart[id]; else appState.cart[id] = next;
  if (delta > 0 && current === 0) showToast('Added to cart', 'success');
  renderApp();
}

function navigateUp() {
  navigateTo('home');
}

function showPincodeDialog() {
  const html = `
    <div style="font-family:var(--font-serif);font-size:20px;font-weight:700;margin-bottom:8px">Check Serviceability</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Maison Lux currently delivers exclusively to Bangalore (560xxx pincodes). Enter your 6-digit pincode to confirm coverage.</div>
    <input class="glass-input" id="pincode-input" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode" value="${appState.checkedPincode}" style="margin-bottom:8px">
    <div id="pincode-error" style="color:var(--error);font-size:12px;margin-bottom:12px;display:none"></div>
    <div style="display:flex;gap:10px">
      <button class="btn-gold" style="flex:1;padding:12px" onclick="applyPincode()">Apply Code</button>
      <button style="flex:1;padding:12px;background:none;border:1px solid var(--dark-border);border-radius:24px;color:var(--text-muted);cursor:pointer" onclick="closeModal()">Back</button>
    </div>`;
  showModal(html);
}

function applyPincode() {
  const input = document.getElementById('pincode-input');
  const errEl = document.getElementById('pincode-error');
  const val = input?.value.trim();
  if (!val || !/^\d{6}$/.test(val)) {
    if (errEl) { errEl.style.display='block'; errEl.textContent='Please enter a valid 6-digit pincode.'; } return;
  }
  appState.checkedPincode = val;
  appState.isServiceable = val.startsWith('560');
  closeModal();
  renderApp();
  showToast(appState.isServiceable ? 'Delivering to ' + val : 'Sorry, ' + val + ' is outside our service area', appState.isServiceable ? 'success' : 'error');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('data-theme', 'dark');
  renderApp();
});
</script>
</body>
</html>
